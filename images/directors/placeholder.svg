  <!-- text -->
  <text x="200" y="405" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#E8E8E8" letter-spacing="1">Regional Director</text>
  <rect x="160" y="422" width="80" height="1" fill="url(#gold)" opacity="0.4"/>
  <text x="200" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999" letter-spacing="2">KD INVESTMENT</text>
  <text x="200" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="#666" letter-spacing="1">Photo coming soon</text>
